name: Auto Update Profile Stats 🤖

on:
  schedule:
    - cron: "0 */6 * * *"   # Runs automatically every 6 hours
  workflow_dispatch:       # Allows manual trigger from Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Fetch & Update Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_stats.py
          python scripts/generate_snake_svg.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add priaansh-stats.svg priaansh-langs.svg priaansh-trophies.svg priaansh-snake.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update GitHub profile stats [skip ci]" && git push)
