name: Generate contribution circuit trace ⚡

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate circuit trace animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: priaansh-gupta
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-cyber.svg?color_snake=#00f0ff&color_dots=#0a1628,#0d2847,#1a4a7a,#3b82f6,#00f0ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
