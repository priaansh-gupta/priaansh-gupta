<style type="text/css"><![CDATA[
text { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { 0% { opacity: 0; transform: translateY(14px) scale(0.7); } 70% { opacity: 1; transform: translateY(-3px) scale(1.06); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes floaty2 { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(6deg); } }
@keyframes neonFlicker { 0% { opacity: 0; } 5% { opacity: 0.7; } 7% { opacity: 0.1; } 10% { opacity: 0.9; } 12% { opacity: 0.3; } 16%, 100% { opacity: 1; } }
@keyframes neonPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1); } }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 0.55; } 88% { opacity: 0.55; } 100% { transform: translateY(-46px); opacity: 0; } }
.ltr { opacity: 0; animation: popIn 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.3) forwards; transform-box: fill-box; transform-origin: center bottom; }
.ii, .pill, .soc, .st, .cl { opacity: 0; }
.pill { transition: transform 0.2s ease, filter 0.2s ease; transform-box: fill-box; transform-origin: center; cursor: pointer; }
.pill:hover { transform: scale(1.08); filter: brightness(1.35); }
.cur { animation: blink 1s step-end infinite; }
.tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
.fl { animation: floaty 5s ease-in-out infinite; }
.fl2 { transform-box: fill-box; transform-origin: center; animation: floaty2 4.2s ease-in-out infinite; }
.neon-on { animation: neonFlicker 2.4s ease 3.2s backwards; }
.rp { animation: rise linear infinite; }
.sep { stroke: #22d65e; stroke-width: 1; opacity: 0.3; }
]]></style>

